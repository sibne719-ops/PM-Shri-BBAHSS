<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Periodic Table Explorer - 118 Elements with 3D Models</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        /* 3D Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* UI Overlay */
        .ui-overlay {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            pointer-events: auto;
        }

        .school-header {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, rgba(102,126,234,0.3), rgba(118,75,162,0.3));
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .school-name {
            font-size: 1.5em;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .principal-name {
            font-size: 1em;
            color: #ffd700;
            text-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
            background: linear-gradient(135deg, #ffffff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.9);
            font-size: 0.9em;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(102,126,234,0.3), rgba(118,75,162,0.3));
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 12px 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .stat-card {
            text-align: center;
            flex: 1;
            min-width: 80px;
            cursor: pointer;
            transition: transform 0.3s;
            padding: 5px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
        }

        .stat-card:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            font-size: 0.7em;
            color: rgba(255,255,255,0.9);
        }

        /* Search Section */
        .search-section {
            background: linear-gradient(135deg, rgba(102,126,234,0.3), rgba(118,75,162,0.3));
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.5);
        }

        .search-btn {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
        }

        .group-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
            justify-content: center;
        }

        .group-btn {
            padding: 5px 12px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
            color: white;
        }

        .group-btn:hover, .group-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }

        /* Element Cards Grid */
        .element-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            max-height: 500px;
            overflow-y: auto;
            padding: 5px;
        }

        .element-grid::-webkit-scrollbar {
            width: 8px;
        }

        .element-grid::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        .element-grid::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .element-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            position: relative;
        }

        .element-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 30px rgba(102,126,234,0.3);
            border-color: #ffd700;
            background: linear-gradient(135deg, rgba(102,126,234,0.4), rgba(118,75,162,0.4));
        }

        .category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(0,0,0,0.4);
            color: white;
        }

        .element-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,215,0,0.5);
        }

        .element-symbol {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .element-number {
            font-size: 1.2em;
            color: #ffd700;
        }

        .element-name {
            font-size: 1.1em;
            margin-bottom: 10px;
            color: white;
        }

        .property-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            margin: 5px 0;
            padding: 3px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            color: #ddd;
        }

        .prediction-badge {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(255,215,0,0.3);
            border-radius: 5px;
            font-size: 0.7em;
            margin-top: 5px;
            color: #ffd700;
        }

        .actual {
            color: #4caf50;
        }

        /* 3D Info Panel */
        .info-panel-3d {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(102,126,234,0.95), rgba(118,75,162,0.95));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.4);
            z-index: 20;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-height: 60vh;
            overflow-y: auto;
            pointer-events: auto;
        }

        .info-panel-3d.active {
            transform: translateY(0);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffd700;
        }

        .close-panel {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .close-panel:hover {
            background: #f44336;
            transform: rotate(90deg);
        }

        .element-3d-preview {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .element-sphere {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(255,215,0,0.5);
            animation: pulse 2s infinite;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255,215,0,0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(255,215,0,0.8); }
        }

        .comparison-table-3d {
            width: 100%;
            border-collapse: collapse;
        }

        .comparison-table-3d th,
        .comparison-table-3d td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .comparison-table-3d th {
            color: #ffd700;
        }

        .predicted {
            color: #ffa500;
        }

        .accuracy-meter-3d {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .accuracy-fill-3d {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #ffd700);
            border-radius: 3px;
            transition: width 0.5s;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 8px 15px;
            background: linear-gradient(135deg, rgba(102,126,234,0.4), rgba(118,75,162,0.4));
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover, .page-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .suggestion-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .suggestion-chip {
            padding: 5px 15px;
            background: rgba(255,215,0,0.2);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .suggestion-chip:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            transform: scale(1.05);
            border-color: transparent;
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(102,126,234,0.7), rgba(118,75,162,0.7));
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7em;
            color: white;
            z-index: 15;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        @media (max-width: 768px) {
            .element-grid {
                max-height: 400px;
            }
            .stats-bar {
                flex-direction: column;
            }
            .element-sphere {
                width: 100px;
                height: 100px;
                font-size: 2em;
            }
        }
    </style>
</head>

            79: { actual: { mass: 196.967, density: 19.32, meltingPoint: 1064.18, boilingPoint: 2856, electronegativity: 2.54, radius: 144 } }
        };
        
        for (let [num, data] of Object.entries(fixes)) {
            elementsData[num].actual = { ...elementsData[num].actual, ...data };
        }

        // Three.js Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.002);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x667eea, 0.5);
        fillLight.position.set(-3, 2, 4);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0xffaa66, 0.4);
        backLight.position.set(2, 3, -5);
        scene.add(backLight);

        // Stars
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 500;
            starPositions[i*3+1] = (Math.random() - 0.5) * 300;
            starPositions[i*3+2] = (Math.random() - 0.5) * 200 - 100;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true }));
        scene.add(stars);

        // Decorative spheres
        const decorativeSpheres = [];
        const decoPositions = [
            { x: -3, y: 1, z: -2, color: 0xff6b6b },
            { x: 0, y: 2, z: -3, color: 0x4ecdc4 },
            { x: 3, y: 1, z: -2, color: 0x74b9ff },
            { x: -2, y: -1, z: -1, color: 0xffb347 },
            { x: 2, y: -1, z: -1, color: 0xfd79a8 }
        ];
        
        decoPositions.forEach(pos => {
            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(0.5, 32, 32),
                new THREE.MeshStandardMaterial({ color: pos.color, emissive: pos.color, emissiveIntensity: 0.4 })
            );
            sphere.position.set(pos.x, pos.y, pos.z);
            scene.add(sphere);
            decorativeSpheres.push(sphere);
        });

        // Particles
        const particleCount = 800;
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 25;
            particlePositions[i*3+1] = (Math.random() - 0.5) * 15;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 15 - 5;
        }
        const particlesGeo = new THREE.BufferGeometry();
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particles = new THREE.Points(particlesGeo, new THREE.PointsMaterial({ color: 0x667eea, size: 0.05, transparent: true }));
        scene.add(particles);

        let currentSphere = null;
        let currentRing = null;

        function createElementSphere(element) {
            if (currentSphere) scene.remove(currentSphere);
            if (currentRing) scene.remove(currentRing);
            
            const geometry = new THREE.SphereGeometry(1.1, 128, 128);
            const material = new THREE.MeshStandardMaterial({ 
                color: element.color, 
                emissive: element.color, 
                emissiveIntensity: 0.5,
                metalness: 0.7,
                roughness: 0.3
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.castShadow = true;
            scene.add(sphere);
            currentSphere = sphere;
            
            const ringGeo = new THREE.TorusGeometry(1.5, 0.04, 64, 200);
            const ringMat = new THREE.MeshStandardMaterial({ color: element.color, emissive: element.color, emissiveIntensity: 0.3 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);
            currentRing = ring;
            
            let time = 0;
            function animateSphere() {
                if (!currentSphere) return;
                time += 0.02;
                const scale = 1 + Math.sin(time * 3) * 0.03;
                sphere.scale.set(scale, scale, scale);
                if (ring) ring.rotation.z = time;
                requestAnimationFrame(animateSphere);
            }
            animateSphere();
        }

        let animTime = 0;
        function animate() {
            requestAnimationFrame(animate);
            animTime += 0.005;
            
            decorativeSpheres.forEach((sphere, idx) => {
                sphere.position.y = decoPositions[idx].y + Math.sin(animTime * 1.5 + idx) * 0.15;
            });
            
            particles.rotation.y += 0.001;
            particles.rotation.x += 0.0005;
            stars.rotation.y += 0.0003;
            
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // UI Functions
        function getAllElementsArray() {
            return Object.keys(elementsData).map(z => ({
                atomicNumber: parseInt(z),
                ...elementsData[z]
            })).sort((a, b) => a.atomicNumber - b.atomicNumber);
        }

        function calculateAccuracy(predicted, actual) {
            if (!predicted || !actual || actual === 0) return { error: null, level: "N/A" };
            const error = Math.abs((actual - predicted) / actual) * 100;
            if (error < 5) return { error: error, level: "Excellent" };
            if (error < 15) return { error: error, level: "Good" };
            return { error: error, level: "Moderate" };
        }

        function getCategoryColor(category) {
            const colors = {
                "Alkali Metal": "#ff6b6b", "Alkaline Earth": "#ffb347", "Transition Metal": "#4ecdc4",
                "Lanthanide": "#45b7d1", "Actinide": "#96ceb4", "Post-transition Metal": "#a8e6cf",
                "Metalloid": "#dfe6e9", "Nonmetal": "#c3e6e6", "Halogen": "#fd79a8", "Noble Gas": "#74b9ff"
            };
            return colors[category] || "#4ecdc4";
        }

        function showElement3D(element) {
            createElementSphere(element);
            
            camera.position.set(0, 0, 5);
            controls.target.set(0, 0, 0);
            controls.update();
            
            const panel = document.getElementById('infoPanel3D');
            const title = document.getElementById('panelTitle');
            const content = document.getElementById('panelContent');
            
            title.innerHTML = `🔬 ${element.name} (${element.symbol}) - Atomic #${element.atomicNumber}`;
            
            const massAcc = calculateAccuracy(element.predicted.mass, element.actual.mass);
            const densityAcc = calculateAccuracy(element.predicted.density, element.actual.density);
            const mpAcc = calculateAccuracy(element.predicted.meltingPoint, element.actual.meltingPoint);
            
            content.innerHTML = `
                <div class="element-3d-preview">
                    <div class="element-sphere" style="background: radial-gradient(circle at 30% 30%, ${getCategoryColor(element.category)}, ${getCategoryColor(element.category)}aa);">
                        ${element.symbol}
                    </div>
                    <div style="flex: 1;">
                        <p><strong>📋 Category:</strong> ${element.category}</p>
                        <p><strong>📍 Position:</strong> Group ${element.group}, Period ${element.period}</p>
                        <p><strong>⚛️ Atomic Number:</strong> ${element.atomicNumber}</p>
                    </div>
                </div>
                
                <table class="comparison-table-3d">
                    <thead><tr><th>Property</th><th>📊 Predicted</th><th>✅ Actual</th><th>🎯 Accuracy</th></tr></thead>
                    <tbody>
                        <tr><td>Atomic Mass</td><td class="predicted">${element.predicted.mass} g/mol</td><td class="actual">${element.actual.mass} g/mol</td>
                        <td><div class="accuracy-meter-3d"><div class="accuracy-fill-3d" style="width: ${100 - (massAcc.error || 0)}%"></div></div>${massAcc.level} (${massAcc.error?.toFixed(2) || 0}% error)</td></tr>
                        <tr><td>Density</td><td class="predicted">${element.predicted.density} ${element.category === "Noble Gas" ? "g/L" : "g/cm³"}</td>
                        <td class="actual">${element.actual.density} ${element.category === "Noble Gas" ? "g/L" : "g/cm³"}</td>
                        <td><div class="accuracy-meter-3d"><div class="accuracy-fill-3d" style="width: ${100 - (densityAcc.error || 0)}%"></div></div>${densityAcc.level || "N/A"}</td></tr>
                        <tr><td>Melting Point</td><td class="predicted">${element.predicted.meltingPoint} °C</td><td class="actual">${element.actual.meltingPoint} °C</td>
                        <td><div class="accuracy-meter-3d"><div class="accuracy-fill-3d" style="width: ${100 - (mpAcc.error || 0)}%"></div></div>${mpAcc.level || "N/A"}</td></tr>
                        <tr><td>Boiling Point</td><td class="predicted">—</td><td class="actual">${element.actual.boilingPoint || "N/A"} °C</td><td>—</td></tr>
                        <tr><td>Electronegativity</td><td class="predicted">—</td><td class="actual">${element.actual.electronegativity || "N/A"}</td><td>—</td></tr>
                    </tbody>
                </table>
                <div style="margin-top: 15px; padding: 10px; background: rgba(255,215,0,0.2); border-radius: 10px;">
                    <strong>💡 3D Model Info:</strong> Glowing sphere = ${element.name} | Color = ${element.category} | Orbiting ring = electron shells
                </div>
            `;
            
            panel.classList.add('active');
            controls.autoRotate = false;
            setTimeout(() => { controls.autoRotate = true; }, 8000);
        }

        function closeInfoPanel() {
            document.getElementById('infoPanel3D').classList.remove('active');
        }

        let currentPage = 1;
        let currentFilter = "all";
        let itemsPerPage = 24;
        let currentSearchQuery = "";

        function filterElements() {
            let elements = getAllElementsArray();
            if (currentFilter !== "all") elements = elements.filter(el => el.category === currentFilter);
            if (currentSearchQuery) {
                elements = elements.filter(el => 
                    el.name.toLowerCase().includes(currentSearchQuery) || 
                    el.symbol.toLowerCase().includes(currentSearchQuery) ||
                    el.atomicNumber.toString() === currentSearchQuery
                );
            }
            return elements;
        }

        function renderElementGrid(elements, page = 1) {
            const grid = document.getElementById('elementGrid');
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageElements = elements.slice(start, end);
            
            if (pageElements.length === 0) {
                grid.innerHTML = '<div class="loading" style="text-align:center;padding:40px;color:white;">No elements found. Try a different search!</div>';
                return;
            }
            
            grid.innerHTML = pageElements.map(element => {
                const massAcc = calculateAccuracy(element.predicted.mass, element.actual.mass);
                return `
                    <div class="element-card" data-atomic-number="${element.atomicNumber}">
                        <div class="category-badge" style="background: ${getCategoryColor(element.category)};">${element.category}</div>
                        <div class="element-header">
                            <span class="element-symbol">${element.symbol}</span>
                            <span class="element-number">#${element.atomicNumber}</span>
                        </div>
                        <div class="element-name">${element.name}</div>
                        <div class="property-row"><span>📊 Predicted Mass:</span><span>${element.predicted.mass} g/mol</span></div>
                        <div class="property-row"><span>✅ Actual Mass:</span><span class="actual">${element.actual.mass} g/mol</span></div>
                        <div class="prediction-badge">🎯 Accuracy: ${massAcc.level} (${massAcc.error?.toFixed(1) || "N/A"}% error)</div>
                    </div>
                `;
            }).join('');
            
            document.querySelectorAll('.element-card').forEach(card => {
                card.addEventListener('click', () => {
                    const atomicNum = parseInt(card.dataset.atomicNumber);
                    const element = getAllElementsArray().find(el => el.atomicNumber === atomicNum);
                    if (element) showElement3D(element);
                });
            });
            
            renderPagination(elements.length, page);
        }

        function renderPagination(totalItems, currentPage) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const paginationDiv = document.getElementById('pagination');
            if (totalPages <= 1) { paginationDiv.innerHTML = ''; return; }
            
            let pages = [];
            if (totalPages <= 7) pages = Array.from({ length: totalPages }, (_, i) => i + 1);
            else pages = [1, 2, 3, '...', totalPages - 2, totalPages - 1, totalPages];
            
            paginationDiv.innerHTML = `
                <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>◀ Previous</button>
                ${pages.map(p => p === '...' ? '<span style="padding: 8px;">...</span>' : `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>`).join('')}
                <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next ▶</button>
            `;
        }

        function changePage(page) {
            const elements = filterElements();
            const totalPages = Math.ceil(elements.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderElementGrid(elements, currentPage);
                closeInfoPanel();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function searchElement() {
            currentSearchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            currentPage = 1;
            const filtered = filterElements();
            renderElementGrid(filtered, currentPage);
            closeInfoPanel();
            
            const exactMatch = filtered.find(el => 
                el.name.toLowerCase() === currentSearchQuery || 
                el.symbol.toLowerCase() === currentSearchQuery
            );
            if (exactMatch) showElement3D(exactMatch);
        }

        function showAllElements() {
            currentSearchQuery = "";
            currentFilter = "all";
            currentPage = 1;
            document.getElementById('searchInput').value = "";
            document.querySelectorAll('.group-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.group-btn[data-group="all"]')?.classList.add('active');
            renderElementGrid(getAllElementsArray(), currentPage);
            closeInfoPanel();
            camera.position.set(0, 3, 12);
            controls.target.set(0, 0, 0);
            controls.update();
            controls.autoRotate = true;
        }

        function resetView() {
            camera.position.set(0, 3, 12);
            controls.target.set(0, 0, 0);
            controls.update();
            controls.autoRotate = true;
            closeInfoPanel();
        }

        function filterByCategory(category) {
            currentFilter = category;
            currentPage = 1;
            currentSearchQuery = "";
            document.getElementById('searchInput').value = "";
            document.querySelectorAll('.group-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.group-btn[data-group="${category}"]`)?.classList.add('active');
            renderElementGrid(filterElements(), currentPage);
            closeInfoPanel();
        }

        function renderStats() {
            const elements = getAllElementsArray();
            const categories = {};
            elements.forEach(el => { categories[el.category] = (categories[el.category] || 0) + 1; });
            
            const statsHtml = Object.entries(categories).slice(0, 6).map(([cat, count]) => `
                <div class="stat-card" onclick="filterByCategory('${cat}')">
                    <div class="stat-number">${count}</div>
                    <div class="stat-label">${cat}</div>
                </div>
            `).join('');
            
            document.getElementById('statsBar').innerHTML = `
                <div class="stat-card" onclick="showAllElements()">
                    <div class="stat-number">118</div>
                    <div class="stat-label">Total Elements</div>
                </div>
                ${statsHtml}
            `;
        }

        function renderGroupFilter() {
            const categories = [...new Set(getAllElementsArray().map(el => el.category))];
            const filterHtml = `
                <div class="group-btn active" data-group="all" onclick="filterByCategory('all')">✨ All (118)</div>
                ${categories.map(cat => `<div class="group-btn" data-group="${cat}" onclick="filterByCategory('${cat}')">${cat}</div>`).join('')}
            `;
            document.getElementById('groupFilter').innerHTML = filterHtml;
        }

        function updateSuggestions() {
            const input = document.getElementById('searchInput');
            const query = input.value.toLowerCase().trim();
            if (query.length < 1) { document.getElementById('suggestionList').innerHTML = ''; return; }
            
            const suggestions = getAllElementsArray().filter(el => 
                el.name.toLowerCase().includes(query) || el.symbol.toLowerCase().includes(query)
            ).slice(0, 5);
            
            document.getElementById('suggestionList').innerHTML = suggestions.map(s => 
                `<div class="suggestion-chip" onclick="document.getElementById('searchInput').value='${s.name}'; searchElement();">
                    ${s.name} (${s.symbol}) - Atomic #${s.atomicNumber} | 🎯 Click for 3D
                </div>`
            ).join('');
        }

        window.changePage = changePage;
        window.filterByCategory = filterByCategory;
        window.showAllElements = showAllElements;
        window.searchElement = searchElement;
        window.resetView = resetView;
        window.closeInfoPanel = closeInfoPanel;

        renderStats();
        renderGroupFilter();
        showAllElements();
        
        document.getElementById('searchBtn').addEventListener('click', searchElement);
        document.getElementById('resetBtn').addEventListener('click', resetView);
        document.getElementById('searchInput').addEventListener('input', updateSuggestions);
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchElement(); });
        
        createElementSphere(getAllElementsArray()[0]);
        console.log('✅ 3D Periodic Table Loaded - Search ANY element to see 3D model!');
    </script>
</body>
</html>
