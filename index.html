        function calculateAccuracy(predicted, actual) {
            if (!predicted || !actual || actual === 0) return { error: null, level: "N/A" };
            const error = Math.abs((actual - predicted) / actual) * 100;
            if (error < 5) return { error: error, level: "Excellent", class: "accuracy-high" };
            if (error < 15) return { error: error, level: "Good", class: "accuracy-medium" };
            return { error: error, level: "Moderate", class: "accuracy-low" };
        }

        function displayElementDetails(element) {
            const panel = document.getElementById('predictionPanel');
            
            const properties = [
                { name: "Atomic Mass (g/mol)", predicted: element.predicted.mass, actual: element.actual.mass, unit: "g/mol" },
                { name: "Density (g/cm³ or g/L)", predicted: element.predicted.density, actual: element.actual.density, unit: element.category === "Noble Gas" || element.category === "Nonmetal" && element.actual.density < 5 ? "g/L" : "g/cm³" },
                { name: "Melting Point (°C)", predicted: element.predicted.meltingPoint, actual: element.actual.meltingPoint, unit: "°C" },
                { name: "Boiling Point (°C)", predicted: null, actual: element.actual.boilingPoint, unit: "°C" },
                { name: "Electronegativity", predicted: null, actual: element.actual.electronegativity, unit: "" },
                { name: "Atomic Radius (pm)", predicted: null, actual: element.actual.radius, unit: "pm" }
            ];

            let overallError = 0;
            let validCount = 0;
            properties.forEach(p => {
                if (p.predicted && p.actual) {
                    const error = Math.abs((p.actual - p.predicted) / p.actual) * 100;
                    overallError += error;
                    validCount++;
                }
            });
            const avgError = validCount > 0 ? overallError / validCount : 0;
            const overallClass = avgError < 10 ? "accuracy-high" : avgError < 25 ? "accuracy-medium" : "accuracy-low";
            
            const predictionHtml = `
                <div class="prediction-title">
                    🔬 Element #${element.atomicNumber}: ${element.name} (${element.symbol})
                    <span class="accuracy ${overallClass}" style="margin-left: 15px;">

                    </span>
                </div>
                <div style="margin-bottom: 20px;">

                                    <td>${p.name}</td>
                                    <td class="predicted">${p.predicted !== null ? p.predicted + " " + p.unit : "—"}</td>

                            `;
                        }).join('')}

                    ${getFunFact(element.name, element.category, element.actual)}
                </div>
            `;
            
            panel.innerHTML = predictionHtml;
            panel.style.display = "block";
            panel.scrollIntoView({ behavior: "smooth", block: "start" });

                "Helium": "It's the only element that never freezes solid at normal pressure - even at absolute zero!",
                "Lithium": "Used in rechargeable batteries for phones, laptops, and electric vehicles.",
                "Carbon": "Diamonds and graphite are both made of pure carbon - just arranged differently!",
                "Gold": "All the gold ever mined could fill about 3 Olympic swimming pools.",
                "Mercury": "The only metal that is liquid at room temperature!",
                "Gallium": "It melts in your hand (at 29.8°C) but won't wet your skin like mercury.",
                "Tungsten": "Has the highest melting point of any metal (3422°C)!",
                "Osmium": "The densest naturally occurring element (22.59 g/cm³)."
            };
            return facts[name] || `${name} was ${category === "Actinide" ? "synthesized in laboratories" : "discovered using periodic table predictions"} and its properties perfectly match periodic trends!`;
        }

        function renderElementGrid(elements, page = 1) {
            const grid = document.getElementById('elementGrid');
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageElements = elements.slice(start, end);
            
            if (pageElements.length === 0) {
                grid.innerHTML = '<div class="loading">No elements found. Try a different search term!</div>';
                return;
            }
            
            grid.innerHTML = pageElements.map(element => {
                const massAccuracy = calculateAccuracy(element.predicted.mass, element.actual.mass);
                return `
                    <div class="element-card" onclick='displayElementDetails(${JSON.stringify(element).replace(/'/g, "&#39;")})'>
                        <div class="category-badge" style="background: ${getCategoryColor(element.category)};">${element.category}</div>
                        <div class="element-header">
                            <span class="element-symbol">${element.symbol}</span>
                            <span class="element-number">#${element.atomicNumber}</span>
                        </div>
                        <div class="element-name">${element.name}</div>
                        <div class="property-row">
                            <span>📊 Predicted Mass:</span>
                            <span>${element.predicted.mass} g/mol</span>
                        </div>
                        <div class="property-row">
                            <span>✅ Actual Mass:</span>
                            <span class="actual">${element.actual.mass} g/mol</span>
                        </div>
                        <div class="prediction-badge">
                            🎯 Accuracy: ${massAccuracy.level} (${massAccuracy.error?.toFixed(1) || "N/A"}% error)
                        </div>
                    </div>
                `;
            }).join('');
            
            renderPagination(elements.length, page);
        }

        function renderPagination(totalItems, currentPage) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const paginationDiv = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                paginationDiv.innerHTML = '';
                return;
            }
            
            let pages = [];
            if (totalPages <= 7) {
                pages = Array.from({ length: totalPages }, (_, i) => i + 1);
            } else {
                pages = [1, 2, 3, '...', totalPages - 2, totalPages - 1, totalPages];
                if (currentPage > 3 && currentPage < totalPages - 2) {
                    pages = [1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages];
                }
            }
            
            paginationDiv.innerHTML = `
                <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>◀ Previous</button>
                ${pages.map(p => p === '...' ? '<span style="padding: 8px;">...</span>' : `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>`).join('')}
                <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next ▶</button>
            `;
        }

        function changePage(page) {
            const elements = filterElements();
            const totalPages = Math.ceil(elements.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderElementGrid(elements, currentPage);
                document.getElementById('predictionPanel').style.display = "none";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function filterElements() {
            let elements = getAllElementsArray();
            
            if (currentFilter !== "all") {
                elements = elements.filter(el => el.category === currentFilter);
            }
            
            if (currentSearchQuery) {
                elements = elements.filter(el => 
                    el.name.toLowerCase().includes(currentSearchQuery) || 
                    el.symbol.toLowerCase().includes(currentSearchQuery) ||
                    el.atomicNumber.toString() === currentSearchQuery
                );
            }
            
            return elements;
        }

        function searchElement() {
            currentSearchQuery = document.getElementById('searchInput').value.toLowerCase();
            currentPage = 1;
            const filtered = filterElements();
            renderElementGrid(filtered, currentPage);
            document.getElementById('predictionPanel').style.display = "none";
        }

        function showAllElements() {
            currentSearchQuery = "";
            currentFilter = "all";
            currentPage = 1;
            document.getElementById('searchInput').value = "";
            document.querySelectorAll('.group-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.group-btn[data-group="all"]')?.classList.add('active');
            renderElementGrid(getAllElementsArray(), currentPage);
            document.getElementById('predictionPanel').style.display = "none";
        }

        function filterByCategory(category) {
            currentFilter = category;
            currentPage = 1;
            currentSearchQuery = "";
            document.getElementById('searchInput').value = "";
            document.querySelectorAll('.group-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.group-btn[data-group="${category}"]`)?.classList.add('active');
            const filtered = filterElements();
            renderElementGrid(filtered, currentPage);
            document.getElementById('predictionPanel').style.display = "none";
        }

        function updateSuggestions() {
            const input = document.getElementById('searchInput');
            const suggestionsDiv = document.getElementById('suggestionList');
            const query = input.value.toLowerCase();
            
            if (query.length < 1) {
                suggestionsDiv.innerHTML = '';
                return;
            }
            
            const suggestions = getAllElementsArray().filter(el => 
                el.name.toLowerCase().includes(query) || 
                el.symbol.toLowerCase().includes(query)
            ).slice(0, 5);
            
            suggestionsDiv.innerHTML = suggestions.map(s => 
                `<div class="suggestion-chip" onclick="document.getElementById('searchInput').value='${s.name}'; searchElement();">
                    ${s.name} (${s.symbol}) - Atomic #${s.atomicNumber}
                </div>`
            ).join('');
        }

        function renderStats() {
            const elements = getAllElementsArray();
            const categories = {};
            elements.forEach(el => {
                categories[el.category] = (categories[el.category] || 0) + 1;
            });
            
            const statsHtml = Object.entries(categories).map(([cat, count]) => `
                <div class="stat-card">
                    <div class="stat-number">${count}</div>
                    <div class="stat-label">${cat}</div>
                </div>
            `).join('');
            
            document.getElementById('statsBar').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">118</div>
                    <div class="stat-label">Total Elements</div>
                </div>
                ${statsHtml}
            `;
        }

        function renderGroupFilter() {
            const categories = [...new Set(getAllElementsArray().map(el => el.category))];
            const filterHtml = `
                <div class="group-btn active" data-group="all" onclick="filterByCategory('all')">All (118)</div>
                ${categories.map(cat => `<div class="group-btn" data-group="${cat}" onclick="filterByCategory('${cat}')">${cat}</div>`).join('')}
            `;
            document.getElementById('groupFilter').innerHTML = filterHtml;
        }

        // Initialize the application
        renderStats();
        renderGroupFilter();
        showAllElements();
        
        // Add event listeners
        document.getElementById('searchInput').addEventListener('input', updateSuggestions);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchElement();
        });
    </script>
</body>
</html>
